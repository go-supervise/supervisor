name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.27"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -short leaves out the Gate 1 enumerations of Theorem C (minutes of CPU),
      # which the gate1 job below runs in full: it is a mandatory check, not a skip.
      - run: go test -short -count=1 ./...

  # Gate 1 (SUPERVISOR.md section 3.8): Theorem U and the frame lemmas F1..F6
  # over their whole neighbourhoods, with every witness, without -short.
  gate1:
    name: gate1 (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.27"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      # The syscall-surface gate judges the monitor as built by the release
      # toolchain (go 1.27): its R_go tables are generated per toolchain, and
      # go 1.25's standard library reaches mprotect where 1.27's does not. So the
      # surface packages run on 1.27 only; every other package runs on both.
      # cmd/svd-monitor itself builds only under go 1.27 (a build constraint; any
      # other toolchain gets a stub that refuses to run), so no unjudged build of
      # M_p exists, and the gate refuses a build whose toolchain is not the one
      # stamped in rgo_*.txt.
      - name: every package but the syscall-surface gate
        run: go test -count=1 -timeout 35m . ./cmd/svd/ ./cmd/svd-monitor/ ./fsm/ ./internal/fdlayout/ ./internal/frame/ ./internal/helper/ ./internal/keyring/ ./internal/monitor/ ./internal/spawn/ ./internal/stagestub/
      - name: the syscall-surface gate (source and symbol halves)
        if: matrix.go == '1.27'
        run: go test -count=1 -timeout 35m ./cmd/syscallsurface/ ./internal/surface/...

  # Privileged lane (SUPERVISOR.md 7.1.1): the spawn path and svd helper under
  # root with every capability, in a container. SVD_PRIVILEGED=1 makes an absent
  # capability or id a FAILURE of the test, never a skip. It also runs the M_p
  # syscall-surface gate (TestMonitorSyscallSurface, TestMonitorSymbolAbsence,
  # TestMonitorSyscallSurfaceCatches): seccomp kill plus the ptrace recorder.
  privileged:
    name: privileged (linux container, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: generated R_go of the lane architecture (printed)
        run: >
          docker run --rm --privileged
          -e GOFLAGS=-buildvcs=false
          -v "$PWD:/src" -w /src golang:1.27
          sh -c 'go build -o /tmp/ss ./cmd/syscallsurface && go build -o /tmp/ref ./internal/surface/refprog && go build -ldflags=-X=runtime.godebugDefault=asyncpreemptoff=1 -o /tmp/stub ./internal/surface/stubhelper && /tmp/ss rgo --arch $(go env GOARCH) --refprog /tmp/ref --stub /tmp/stub --out /tmp/rgo.txt; cat /tmp/rgo.txt'
      - name: spawn and helper tests as root
        run: >
          docker run --rm --privileged
          -e SVD_PRIVILEGED=1 -e GOFLAGS=-buildvcs=false
          -v "$PWD:/src" -w /src golang:1.27
          go test -race -count=1 ./internal/spawn/ ./internal/helper/ ./internal/keyring/ ./internal/stagestub/ ./cmd/svd/ ./internal/surface/ ./internal/monitor/ ./cmd/syscallsurface/ ./cmd/svd-monitor/

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...
